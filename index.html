<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Daily Pulse</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body { background-color: #060910; color: #e2e8f0; font-family: sans-serif; }
        .glass-card { background: #0f1420; border: 1px solid #1a2035; border-radius: 24px; }
        .inner-card { background: #090c14; border: 1px solid #1a2035; border-radius: 12px; }
        .tab-active { background: #4f8ef7; color: white; box-shadow: 0 4px 15px rgba(79, 142, 247, 0.3); }
        .ring-gradient { stroke-dasharray: 251; stroke-dashoffset: 75; transition: stroke-dashoffset 1s ease-in-out; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        function App() {
            const [tab, setTab] = useState('news');

            return (
                <div className="max-w-md mx-auto p-5 pb-20">
                    {/* Header */}
                    <div className="text-center mt-8 mb-8">
                        <h1 className="text-3xl font-black tracking-tight mb-1">Daily Pulse</h1>
                        <p className="text-[10px] text-gray-500 font-mono tracking-widest">SUNDAY, MAY 10, 2026</p>
                    </div>

                    {/* Nav Tabs */}
                    <div className="flex gap-2 p-1.5 glass-card mb-6">
                        <button onClick={() => setTab('news')} className={flex-1 py-3 rounded-xl text-xs font-bold transition-all ${tab === 'news' ? 'tab-active' : 'text-gray-500'}}>🌐 News</button>
                        <button onClick={() => setTab('nifty')} className={flex-1 py-3 rounded-xl text-xs font-bold transition-all ${tab === 'nifty' ? 'tab-active' : 'text-gray-500'}}>📈 Nifty</button>
                        <button onClick={() => setTab('market')} className={flex-1 py-3 rounded-xl text-xs font-bold transition-all ${tab === 'market' ? 'tab-active' : 'text-gray-500'}}>🇮🇳 Market</button>
                    </div>

                    {/* News Section */}
                    {tab === 'news' && (
                        <div className="glass-card p-6">
                            <div className="flex items-center gap-2 mb-6">
                                <span className="text-blue-400">🌐</span>
                                <h2 className="text-sm font-bold uppercase tracking-wider">World News Sentiment</h2>
                            </div>

                            <div className="flex items-center gap-8 mb-8">
                                {/* Ring Chart */}
                                <div className="relative w-24 h-24">
                                    <svg viewBox="0 0 100 100" className="w-full h-full -rotate-90">
                                        <circle cx="50" cy="50" r="40" fill="none" stroke="#1a2035" strokeWidth="10" />
                                        <circle cx="50" cy="50" r="40" fill="none" stroke="#f04e6e" strokeWidth="10" strokeDasharray="251" strokeDashoffset="75" strokeLinecap="round" />
                                    </svg>
                                    <div className="absolute inset-0 flex flex-col items-center justify-center">
                                        <span className="text-xl font-bold text-red-500">70%</span>
                                        <span className="text-[8px] text-gray-500">NEG</span>
                                    </div>
                                </div>

                                {/* Progress Bars */}
                                <div className="flex-1 space-y-3">
                                    <div>
                                        <div className="flex justify-between text-[10px] mb-1"><span className="text-green-400">✅ Positive</span><span>18%</span></div>
                                        <div className="h-1.5 w-full bg-[#1a2035] rounded-full overflow-hidden"><div className="h-full bg-green-500 w-[18%]"></div></div>
                                    </div>
                                    <div>
                                        <div className="flex justify-between text-[10px] mb-1"><span className="text-red-400">🔴 Negative</span><span>70%</span></div>
                                        <div className="h-1.5 w-full bg-[#1a2035] rounded-full overflow-hidden"><div className="h-full bg-red-500 w-[70%]"></div></div>
                                    </div>
                                </div>
                            </div>

                            <p className="text-xs text-gray-400 leading-relaxed italic mb-8 font-serif">
                                "Global mood is heavily negative today. The US-Israel-Iran conflict dominates headlines. A fragile 3-day ceasefire offers hope."
                            </p>

                            <div className="grid grid-cols-2 gap-3">
                                <div className="inner-card p-3">
                                    <h4 className="text-[9px] text-green-500 font-bold mb-2 uppercase tracking-widest">Positive</h4>
                                    <p className="text-[9px] text-gray-500 leading-tight border-l border-green-900 pl-2">Trump brokers 3-day Russia ceasefire</p>
                                </div>
                                <div className="inner-card p-3">
                                    <h4 className="text-[9px] text-red-500 font-bold mb-2 uppercase tracking-widest">Negative</h4>
                                    <p className="text-[9px] text-gray-500 leading-tight border-l border-red-900 pl-2">Strait of Hormuz closure rattles markets</p>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Placeholder for Nifty/Market */}
                    {tab !== 'news' && (
                        <div className="glass-card p-10 text-center text-gray-600 italic text-sm">
                            Updating {tab} data for May 10...
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
